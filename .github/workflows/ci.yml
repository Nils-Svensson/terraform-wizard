name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Go mod download
        run: go mod download

      - name: Go build
        run: go build ./backend/...

      - name: Go test
        run: go test ./backend/...

  docker-build-backend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GCP Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2    
        with:
            project_id: ${{ secrets.GCP_PROJECT_ID }}  
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-north2-docker.pkg.dev --quiet

      - name: Build and push docker image
        run: |
          SHA=${GITHUB_SHA::7}
          IMAGE=europe-north2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/terraform-wizard/backend
          docker build -t $IMAGE -t $IMAGE:$SHA -f backend/Dockerfile .
          docker push $IMAGE
          docker push $IMAGE:$SHA  
      



  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
  
        
  docker-build-frontend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GCP Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2    
        with:
            project_id: ${{ secrets.GCP_PROJECT_ID }}  
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-north2-docker.pkg.dev --quiet

      - name: Build and push docker image
        run: |
          SHA=${GITHUB_SHA::7}
          IMAGE=europe-north2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/terraform-wizard/frontend:latest
          docker build -t $IMAGE -f frontend/Dockerfile .
          docker push $IMAGE
  
  proxy:
    name: Proxy CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Go mod download
        run: go mod download

      - name: Go build
        run: go build -o proxy ./reverse-proxy

      - name: Go test
        run: go test ./reverse-proxy/...          

  docker-build-proxy:
    runs-on: ubuntu-latest
    needs: proxy
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GCP Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2    
        with:
            project_id: ${{ secrets.GCP_PROJECT_ID }}  
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-north2-docker.pkg.dev --quiet

      - name: Build and push docker image
        run: |
          SHA=${GITHUB_SHA::7}
          IMAGE=europe-north2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/terraform-wizard/reverse-proxy:latest
          docker build -t $IMAGE -f reverse-proxy/Dockerfile .
          docker push $IMAGE        
